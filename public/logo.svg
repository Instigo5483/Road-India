<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="120">
  <defs>
    <linearGradient id="saffronGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#138808"/>
      <stop offset="100%" stop-color="#0E5A05"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(10, 10)">
    <!-- Pin Outer Shape (Saffron top half) -->
    <path d="M50 0 C22.4 0 0 22.4 0 50 C0 80 50 100 50 100" fill="none" stroke="url(#saffronGradient)" stroke-width="8" stroke-linecap="round"/>
    <!-- Pin Outer Shape (Green bottom half) -->
    <path d="M50 100 C50 100 100 80 100 50 C100 22.4 77.6 0 50 0" fill="none" stroke="url(#greenGradient)" stroke-width="8" stroke-linecap="round"/>

    <!-- Highway Perspective inside the Pin -->
    <polygon points="32,75 42,32 58,32 68,75" fill="#1E293B"/>
    <!-- Dashed Center Road Stripe -->
    <line x1="50" y1="36" x2="50" y2="70" stroke="#F8FAFC" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round"/>

    <!-- AI Pulse Node at Top -->
    <circle cx="50" cy="22" r="5" fill="#2563EB"/>
  </g>

  <!-- Wordmark -->
  <text x="130" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
    Road<tspan fill="#FF9933">Ind</tspan><tspan fill="#138808">ia</tspan>
  </text>
  <!-- Tagline -->
  <text x="132" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748B" letter-spacing="1.5">
    CIVIC ACTION IN SECONDS
  </text>
</svg>
